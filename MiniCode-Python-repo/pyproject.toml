[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minicode-py"
version = "0.1.0"
description = "A lightweight terminal coding assistant for local development workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2,<7.0.0"]

[project.optional-dependencies]
dev = [
    "playwright>=1.51,<2.0",
    "pytest>=8.0.0",
    "hypothesis>=6.0.0",
    "httpx2>=2.0.0,<3.0.0",
    "setuptools>=68",
]
web = [
    "Pillow>=11.0.0,<13.0.0",
    "playwright>=1.51,<2.0",
    "tokenizers>=0.21.0,<1.0.0",
    "fastapi>=0.116.0,<1.0.0",
    "httpx>=0.28.0,<1.0.0",
    "uvicorn[standard]>=0.35.0,<1.0.0",
]
memory = [
    "cryptography>=45.0.0,<47.0.0",
    "tiktoken>=0.11.0,<1.0.0",
]

[project.scripts]
minicode-py = "minicode.main:main"
minicode-headless = "minicode.headless:main"
minicode-readiness = "minicode.readiness:main"
minicode-structure-check = "minicode.structure_check:main"
minicode-provider-smoke = "minicode.provider_smoke:main"
minicode-web = "minicode.web_api:main"
minicode-memory = "minicode.paged_memory.admin:main"

[tool.setuptools.package-data]
"minicode.paged_memory" = ["sql/*.sql"]
"Package.AgentRuntime" = ["Config/Tokenizers/*.json", "Config/Tokenizers/*.md"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["."]
testpaths = ["tests", "Package/AgentRuntime/Test"]
python_files = ["test_*.py", "*.Test.py"]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["minicode*", "Main*", "Package*"]
namespaces = true


[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = false
